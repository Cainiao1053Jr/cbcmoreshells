plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.139'
    id 'idea'
}

version = mod_version
group = 'com.cainiao1053.cbcmoreshells'
archivesBaseName = 'cbcmoreshells'

tasks.named('jar', Jar) {
    archiveFileName.set("CBC-Military-Supplement-${minecraft_version}-${project.version}.jar")
}

// Minecraft 1.21.1 requires Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            logLevel = org.slf4j.event.Level.DEBUG
        }

        server {
            server()
            logLevel = org.slf4j.event.Level.DEBUG
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        cbcmoreshells {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dirs 'libs'
    }
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com/'
    }
//    maven {
//        name = 'Kotlin for Forge'
//        url = 'https://thedarkcolour.github.io/KotlinForForge/'
//    }
    //maven { url 'https://maven.valkyrienskies.org/' }
    maven { url 'https://maven.fabricmc.net/' }
//    maven {
//        url = "https://api.modrinth.com/maven"
//        content {
//            includeGroup("maven.modrinth")
//        }
//    }
//    maven {
//        url "https://cursemaven.com"
//        content {
//            includeGroup "curse.maven"
//        }
//    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.createmod.net" } // Create, Flywheel, Ponder
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { // Ritchie's Projectile Library
        url = "https://maven.realrobotix.me/master/"
        content {
            includeGroup("com.rbasamoyai")
        }
    }
    maven {
        url = "https://repo.essential.gg/repository/maven-public"
    }
//    maven {
//        name = "CottonMC"
//        url = "https://server.bbkr.space/artifactory/libs-release"
//    }
    maven { url = "https://maven.bawnorton.com/releases" }

    maven { url = "https://maven.neoforged.net/releases/" }
    maven { url = "https://maven.theillusivec4.top/" } // Curios
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = "https://maven.ryanhcode.dev/releases" } // Sable
    maven { url = "https://maven.ftb.dev/release" } // FTB (ftb-chunks, ftb-teams, ftb-library)
    maven { url = "https://maven.architectury.dev" } // Architectury
    maven { url = "https://maven.squiddev.cc" } // CC: Tweaked
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    // Create (NeoForge 1.21.1)
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        exclude group: "xaero.lib"        // no public Maven
        exclude group: "dev.ftb.mods"     // optional FTB integration, versions not on Maven
        exclude group: "dev.architectury" // optional, version string malformed (13d.0.8)
        exclude group: "cc.tweaked"       // optional CC:Tweaked integration
        exclude group: "info.journeymap"  // old API version shadows JourneyMap's bundled newer API
        exclude group: "maven.modrinth", module: "journeymap"
    }
    //implementation "dev.engine_room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_neoforge_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    implementation "maven.modrinth:rjti7mm0:E47zeSfp"

    // Create Big Cannons (NeoForge 1.21.1) — update cbc_file_id in gradle.properties
    //implementation("curse.maven:createbigcannons-646668:${cbc_file_id}")
//            {
//        exclude group: "info.journeymap"       // version conflict: old API shadows JourneyMap's bundled newer API
//        exclude group: "maven.modrinth", module: "journeymap"
//    }

    implementation(files("libs/createbigcannons-5.11.3.jar"))

    //implementation "curse.maven:sable-1312371:${sable_version_cf}"
    api("dev.ryanhcode.sable:sable-neoforge-${project.minecraft_version}:${project.sable_version}")

    // Valkyrien Skies (version intentionally not updated)
//    implementation("org.valkyrienskies:valkyrienskies-121-neoforge:${vs2_version}") { transitive = false }
//    compileOnly "org.valkyrienskies.core:api:${vs_core_version}"
//    compileOnly "org.valkyrienskies.core:api-game:${vs_core_version}"
//    compileOnly "org.valkyrienskies.core:util:${vs_core_version}"
//    compileOnly "org.valkyrienskies.core:impl:${vs_core_version}"

    implementation "com.fasterxml.jackson.core:jackson-annotations:2.15.2"

    // Kotlin for NeoForge
    //implementation "thedarkcolour:kotlinforforge-neoforge:${forge_kotlin_version}"

    // Ritchie's Projectile Library
    implementation("com.rbasamoyai:ritchiesprojectilelib:${rpl_version}+mc.${minecraft_version}-neoforge-build.${rpl_build}") { transitive = false }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "cbcmoreshells",
                "Specification-Vendor"    : "cainiao1053",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "cainiao1053",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "cbcmoreshells.mixins.json"
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
